# ─────────────────────────────────────────────────────────────
#  EZRA'S NOTES · INVESTOR HOLDINGS
#  This is the only file you need to edit (see COMO-EDITAR.md).
#
#  To ADD a manager: copy one block (from "- id:" down to the
#  next "- id:"), paste it at the end and change the values.
#  To REMOVE a manager: delete its block. Its filings stay in
#  data/ but stop showing on the site.
#
#  id:         the manager's name in lowercase with hyphens (josh-tarasoff).
#              When the firm has no single star manager, the firm's name.
#              It's the page's address: holdings.ezrasnotes.com/m/josh-tarasoff.html
#  cik:        the firm's number at the SEC (EDGAR). Ask Claude for it.
#  letters:    the manager's id on letters.ezrasnotes.com, if he has a page there
#              (the end of the address: letters.ezrasnotes.com/m/hayden.html → hayden).
#              Then "why" is taken from that site and you can leave it out. Otherwise: no.
#  old_ids:    earlier addresses of the page, so old links still land here.
#
#  Keep the two spaces of indentation. Text with a colon (:)
#  inside must go between double quotes.
# ─────────────────────────────────────────────────────────────

