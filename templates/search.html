{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block description %}Look up a manager, a firm or a company across every 13F on the site.{% endblock %}
{% block main %}
<h1 class="page-title">Search</h1>
<p class="dek">Look up a manager, a firm, a company or a ticker.</p>
<label class="filter">
  <span class="sr">Search</span>
  <input id="q" type="search" placeholder="Try Li Lu, Berkshire or GOOGL" autocomplete="off" autofocus>
</label>
<div id="results" data-index="search.json" data-root=""></div>
<noscript><p class="small">Search needs JavaScript. You can browse the <a href="managers.html">managers</a> and <a href="companies.html">companies</a> instead.</p></noscript>
<script src="static/search.js?v={{ asset_v }}"></script>
{% endblock %}
