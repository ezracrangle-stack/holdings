# What each 13F line is. A 13F names securities by CUSIP (a 9-character code)
# and a short issuer name, but no ticker. This file adds the company name and
# ticker the site shows.
#
#   name:   company name on the site. Use the same name as on letters.ezrasnotes.com,
#           so the company page lands on the same web address (Alphabet → /c/alphabet.html).
#   ticker: current ticker, or the last one if the company no longer trades.
#   sic:    the company's industry code at the SEC (on EDGAR, under the company name).
#           The site turns it into a broad sector. Leave it out if you don't know it.
#   sector: optional, to override the sector the SIC code gives.
#   fund:   yes for ETFs and funds. They show in the portfolio but get no company page.
#   note:   anything worth knowing (old names, filing errors).
#
# A CUSIP that isn't here still shows on the site, with the name from the filing
# and no ticker, and the weekly check asks you (or Claude) to add it.

