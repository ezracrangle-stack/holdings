name: Weekly check of links to Investor Letters

on:
  schedule:
    - cron: "41 14 * * 3"     # every Wednesday, 14:41 UTC (8:41 am in Mexico City)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every link to letters.ezrasnotes.com
        run: python scripts/check_links.py

      - name: Alert Ezra about broken links
        if: hashFiles('links-alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create links-alert --color D93F0B --description "Broken links to the letters site" 2>/dev/null || true
          OPEN=$(gh issue list --label links-alert --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file links-alert.md
          else
            gh issue create --title "Broken links to Investor Letters" --label links-alert --body-file links-alert.md
          fi

      - name: Close the alert when the links work again
        if: hashFiles('links-alert.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --label links-alert --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "All links to Investor Letters work as of $(date -u +%F)."
          fi
